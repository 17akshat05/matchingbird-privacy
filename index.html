<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Bird - Find Meaningful Connections</title>
    <style>
        :root {
            --primary: #FF4081;
            --primary-dark: #C51162;
            --bg: #0F0F14;
            --surface: #181822;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0C0;
            --border: #2A2A38;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 480px;
            margin: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 72px;
            margin-bottom: 12px;
        }
        h1 {
            color: var(--primary);
            font-size: 36px;
            margin: 0 0 12px 0;
        }
        p {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        a.btn {
            display: block;
            background-color: var(--primary);
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            transition: opacity 0.2s;
        }
        a.btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        a.btn:hover {
            opacity: 0.85;
        }
        footer {
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🐦</div>
        <h1>Matching Bird</h1>
        <p>Find meaningful connections. Meet people. Discover nearby matches. Connect naturally.</p>
        <div class="links">
            <a href="privacy-policy.html" class="btn">Privacy Policy</a>
            <a href="terms-of-service.html" class="btn btn-secondary">Terms of Service</a>
        </div>
        <footer>
            <p>&copy; 2026 Matching Bird. Developed by Akshat.</p>
            <p style="margin-top: 6px;">Contact: <a href="mailto:akshatearnyt17@gmail.com" style="color: var(--primary); text-decoration: none;">akshatearnyt17@gmail.com</a></p>
        </footer>
    </div>
</body>
</html>
